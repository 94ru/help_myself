<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>先放下</title><style>body{margin:0;background:#f7f4ee;color:#24231f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:720px;margin:auto;padding:28px 18px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.k{font-size:12px;color:#6f8067;letter-spacing:.12em}h1{font-size:28px;font-weight:500;margin:8px 0}.sub,.meta,small{font-size:13px;color:#79756b}.box{background:#fffdf8;border:1px solid #e6e0d5;border-radius:15px;padding:14px;margin:12px 0}textarea{width:100%;min-height:64px;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:16px;box-sizing:border-box}.btn{border:1px solid #d8d0c4;border-radius:999px;padding:8px 12px;background:#fffdf8;cursor:pointer;font:inherit;font-size:13px}.primary{background:#6f8067;color:#fff;border:0}.views{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.view{text-align:left;border-radius:12px;min-height:68px}.view.active{background:#e7eee2;border-color:#c6d5bf}.view strong{display:block;font-weight:500;margin-bottom:4px}.item{padding:13px 0;border-bottom:1px solid #ece7de}.item:last-child{border:0}.actions,.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{border:1px solid #d8e2d3;background:#f0f5ed;border-radius:999px;padding:6px 10px;color:#53644d;cursor:pointer;font-size:13px}.chip.active{background:#6f8067;color:white}.empty{padding:18px 0;text-align:center;color:#79756b}.toast{display:none;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2e332d;color:white;padding:10px 14px;border-radius:999px;font-size:13px}@media(max-width:560px){main{padding:22px 14px}.views{grid-template-columns:repeat(2,1fr)}}</style></head><body><main id="app"><div class="top"><div><div class="k">先放下</div><h1>有什么事挂在心上？</h1><div class="sub">写下来，我替你记着。</div></div><span id="count" class="sub">0 件挂着</span></div><form id="form" class="box"><textarea id="input" aria-label="记录一件事"></textarea><div class="row"><span class="sub">一句话就够了</span><button class="btn primary">接住它</button></div></form><div class="views"><button class="btn view active" data-view="time"><strong>到点叫我</strong><small>按具体时间</small></button><button class="btn view" data-view="free"><strong>有空就做</strong><small>可执行、无时间</small></button><button class="btn view" data-view="context"><strong>下次遇到</strong><small>人物、地点、情境</small></button><button class="btn view" data-view="goal"><strong>未来目标</strong><small>长期想实现</small></button></div><section class="box"><div class="row"><h2 id="title" style="font-size:16px;font-weight:500">到点叫我</h2><span id="hint" class="sub"></span></div><div id="chips" class="chips"></div><div id="list"></div></section><div class="row"><h2 style="font-size:16px;font-weight:500">已经放下</h2><button id="history" class="btn">查看</button></div><div id="toast" class="toast"></div></main><script>(()=>{const q=s=>document.querySelector(s),form=q('#form'),input=q('#input'),list=q('#list'),chips=q('#chips'),title=q('#title'),hint=q('#hint'),toast=q('#toast'),count=q('#count');const examples=['例如：明天下午两点提醒我起床','例如：周三见妈妈时把报告给她','例如：给房子窗户量一下尺寸','例如：未来想买一套带院子的房子','例如：下次去牛表妹烤肉提前订位'];input.placeholder=examples[Math.floor(Math.random()*examples.length)];let items=JSON.parse(localStorage.getItem('held-items-v6')||'null')||[],view='time',selected='';const save=()=>localStorage.setItem('held-items-v6',JSON.stringify(items)),say=x=>{toast.textContent=x;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)};const people=['妈妈','爸爸','猫咪','狗狗','小明','奥菲利亚','牛表妹烤肉','物业','医院','公司','家里'];const parse=x=>{const time=/(明天|后天|今天|明早|明晚|周[一二三四五六日天]|周末|[上下]午|[0-2]?\d[点时])/.test(x),m=x.match(/([0-2]?\d)[点时]/),context=people.filter(k=>x.includes(k)),hasContext=context.length||/(下次|见|遇到|去|联系|问问|订位)/.test(x),goal=/(未来|以后|梦想|目标|想买|想学|想成为)/.test(x);return{kind:goal?'goal':'action',time,timeText:m?m[1].padStart(2,'0')+':00':time?'已识别时间':'',contexts:context,hasContext}};const calendar=x=>{const m=x.timeText.match(/(\d{1,2}):(\d{2})/),d=new Date();if(m){d.setHours(+m[1],+m[2],0,0);if(d<=new Date())d.setDate(d.getDate()+1)}else d.setHours(d.getHours()+1);const z=n=>String(n).padStart(2,'0'),s=d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'T'+z(d.getHours())+z(d.getMinutes())+'00',ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//HeldApp//CN','BEGIN:VEVENT','UID:'+x.id+'@held','DTSTART:'+s,'DTEND:'+s,'SUMMARY:'+x.text.replace(/[\\,;]/g,' '),'END:VEVENT','END:VCALENDAR'].join(String.fromCharCode(13,10)),u=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})),a=document.createElement('a');a.href=u;a.download='先放下-日历事件.ics';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);say('已生成日历文件')};function match(x){if(x.done)return false;if(view==='time')return x.time;if(view==='free')return x.kind==='action'&&!x.time&&!x.hasContext;if(view==='context')return x.hasContext&&(!selected||x.contexts.includes(selected));return x.kind==='goal'}function draw(){const shown=items.filter(match),names={time:'到点叫我',free:'有空就做',context:'下次遇到',goal:'未来目标'};title.textContent=names[view];hint.textContent=shown.length+' 件';count.textContent=items.filter(x=>!x.done).length+' 件挂着';chips.innerHTML='';if(view==='context'){[...new Set(items.filter(x=>!x.done&&x.hasContext).flatMap(x=>x.contexts))].forEach(k=>{const b=document.createElement('button');b.className='chip'+(selected===k?' active':'');b.textContent=k;b.onclick=()=>{selected=selected===k?'':k;draw()};chips.appendChild(b)})}list.innerHTML=shown.length?'':'<div class="empty">这里还没有记录。</div>';shown.forEach(x=>{const e=document.createElement('div');e.className='item';const tags=[x.kind==='goal'?'未来目标':x.time?'时间提醒':x.hasContext?'情境提醒':'有空就做',...x.contexts].join(' · ');e.innerHTML='<div class="row"><span class="text"></span><span class="meta"></span></div><div class="meta tags"></div><div class="actions"><button class="btn cal">加入日历</button><button class="btn drop">放下</button></div>';e.querySelector('.text').textContent=x.text;e.querySelector('.meta').textContent=x.timeText||'';e.querySelector('.tags').textContent=tags;e.querySelector('.cal').onclick=()=>calendar(x);e.querySelector('.drop').onclick=()=>{x.done=true;save();say('已从心里放下');draw()};list.appendChild(e)})}form.onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;items.unshift({id:Date.now(),text,done:false,...parse(text)});save();input.value='';say('已替你记住');draw()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;selected='';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));draw()});q('#history').onclick=()=>{view='history';title.textContent='已经放下';chips.innerHTML='';const done=items.filter(x=>x.done);hint.textContent=done.length+' 件';list.innerHTML=done.length?done.map(x=>'<div class="item">'+x.text+'<div class="meta">已放下</div></div>').join(''):'<div class="empty">还没有放下的事项。</div>'};draw()})()</script></body></html>
