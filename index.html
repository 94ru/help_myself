<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>先放下</title><style>body{margin:0;background:#f7f4ee;color:#24231f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:680px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between}.kicker{font-size:12px;color:#6f8067;letter-spacing:.12em}h1{font-size:28px;font-weight:500;margin:8px 0}.sub,.meta,small{color:#79756b;font-size:13px}.box{background:#fffdf8;border:1px solid #e6e0d5;border-radius:15px;padding:14px;margin:12px 0}textarea{width:100%;min-height:65px;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:16px;box-sizing:border-box}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.btn{border:1px solid #d8d0c4;border-radius:999px;padding:8px 12px;background:#fffdf8;cursor:pointer;font:inherit;font-size:13px}.primary{background:#6f8067;color:#fff;border:0}.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.shelf button{text-align:left;border-radius:10px;min-height:58px}.actions{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}@media(max-width:520px){main{padding:22px 14px}.shelf{grid-template-columns:repeat(2,1fr)}}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2e332d;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;display:none;white-space:nowrap}</style></head><body><main id="app"><div class="top"><div><div class="kicker">先放下</div><h1>有什么事挂在心上？</h1><div class="sub">写下来，我替你记着。你可以先去做眼前的事。</div></div><div id="count" class="sub">0 件挂着</div></div><form id="form" class="box"><textarea id="input" aria-label="记录一件事" placeholder="例如：周三下午五点提醒我给妈妈买药"></textarea><div class="row"><span class="sub">支持“明天”“周末”“下周一”</span><button class="btn primary">接住它</button></div></form><h3>现在需要你处理</h3><section id="list"></section><h3>替你记着</h3><div class="shelf"><button class="btn" data-shelf="later"><strong>有空再做</strong><br><small>0 件</small></button><button class="btn" data-shelf="context"><strong>下次遇到</strong><br><small>0 件</small></button><button class="btn" data-shelf="someday"><strong>以后再想</strong><br><small>0 件</small></button><button class="btn" data-shelf="done"><strong>已经放下</strong><br><small>0 件</small></button></div><div id="toast"></div></main><script>(()=>{const app=document.getElementById('app'),form=document.getElementById('form'),input=document.getElementById('input'),list=document.getElementById('list'),count=document.getElementById('count'),toast=document.getElementById('toast');let items=JSON.parse(localStorage.getItem('held-items-v3')||'null')||[{id:1,text:'周三下午五点给妈妈买药',meta:'周三 · 17:00',bucket:'today',done:false},{id:2,text:'下次和小李见面，问问他的新工作',meta:'下次遇到 · 小李',bucket:'context',done:false}];const save=()=>localStorage.setItem('held-items-v3',JSON.stringify(items));const say=x=>{toast.textContent=x;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)};const bucket=x=>/(明天|后天|周[一二三四五六日天]|周末|[0-2]?\d[点时])/.test(x)?'today':/(下次|见面|遇到|问问)/.test(x)?'context':/(以后|想学|想做)/.test(x)?'someday':'later';const meta=x=>{const m=x.match(/([0-2]?\d)[点时]/);return m?('已设定 · '+m[1].padStart(2,'0')+':00'):/明天|后天|周末/.test(x)?x.match(/明天|后天|周末/)[0]+' · 10:00':'有空再做'};const calendar=x=>{const d=new Date(Date.now()+3600000),p=n=>String(n).padStart(2,'0'),stamp=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00',ics=['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT','UID:'+x.id+'@held-app','DTSTART:'+stamp,'DTEND:'+stamp,'SUMMARY:'+x.text.replace(/[\\,;]/g,' '),'END:VEVENT','END:VCALENDAR'].join(String.fromCharCode(13,10)),url=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})),a=document.createElement('a');a.href=url;a.download='先放下-日历事件.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);say('已生成日历文件，请用手机日历打开')};function draw(){const active=items.filter(x=>!x.done&&(x.bucket==='today'||x.bucket==='later'));count.textContent=active.length+' 件挂着';list.innerHTML=active.length?'':'<div class="box sub">这里很安静。记录一件事，先让它离开你的脑子。</div>';active.forEach(x=>{const e=document.createElement('div');e.className='box';e.innerHTML='<div class="row"><span class="text"></span><button class="btn ok">完成</button></div><div class="meta"></div><div class="actions"><button class="btn cal">加入手机日历</button><button class="btn later">换个时间</button><button class="btn drop">放下</button></div>';e.querySelector('.text').textContent=x.text;e.querySelector('.meta').textContent=x.meta;e.querySelector('.ok').onclick=()=>{x.done=true;x.bucket='done';save();say('已经放下');draw()};e.querySelector('.drop').onclick=()=>{x.done=true;x.bucket='done';save();say('已从心里放下');draw()};e.querySelector('.later').onclick=()=>{x.meta='明天 · 10:00';x.bucket='today';save();say('明天再提醒你');draw()};e.querySelector('.cal').onclick=()=>calendar(x);list.appendChild(e)});app.querySelectorAll('[data-shelf]').forEach(b=>b.querySelector('small').textContent=items.filter(x=>x.bucket===b.dataset.shelf).length+' 件')}form.onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;items.unshift({id:Date.now(),text,meta:meta(text),bucket:bucket(text),done:false});save();input.value='';say('已替你记住');draw()};draw()})()</script></body></html>
