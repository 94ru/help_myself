<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>先放下</title><style>body{margin:0;background:#f7f4ee;color:#24231f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:720px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between}.kicker{font-size:12px;color:#6f8067;letter-spacing:.12em}h1{font-size:28px;font-weight:500;margin:8px 0}.sub,.meta,small{color:#79756b;font-size:13px}.box{background:#fffdf8;border:1px solid #e6e0d5;border-radius:15px;padding:14px;margin:12px 0}textarea{width:100%;min-height:65px;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:16px;box-sizing:border-box}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.btn{border:1px solid #d8d0c4;border-radius:999px;padding:8px 12px;background:#fffdf8;cursor:pointer;font:inherit;font-size:13px}.primary{background:#6f8067;color:#fff;border:0}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 22px}.cat{min-height:76px;text-align:left;border-radius:12px}.cat.active{background:#e7eee2;border-color:#c6d5bf}.cat strong{font-weight:500;display:block;margin-bottom:5px}.view-title{display:flex;justify-content:space-between;align-items:center}.view-title h2{font-size:16px;font-weight:500}.item{padding:13px 0;border-bottom:1px solid #ece7de}.item:last-child{border-bottom:0}.actions{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.keywords{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 4px}.keyword{border:1px solid #d8e2d3;background:#f0f5ed;border-radius:999px;padding:7px 10px;color:#53644d;cursor:pointer;font-size:13px}.keyword.active{background:#6f8067;color:#fff}.empty{color:#79756b;padding:18px 0;text-align:center}.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.shelf button{text-align:left;border-radius:10px;min-height:60px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2e332d;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;display:none;white-space:nowrap}@media(max-width:560px){main{padding:22px 14px}.cats{grid-template-columns:repeat(2,1fr)}.shelf{grid-template-columns:repeat(2,1fr)}} </style></head><body><main id="app"><div class="top"><div><div class="kicker">先放下</div><h1>有什么事挂在心上？</h1><div class="sub">写下来，我替你记着。你可以先去做眼前的事。</div></div><div id="count" class="sub">0 件挂着</div></div><form id="form" class="box"><textarea id="input" aria-label="记录一件事"></textarea><div class="row"><span class="sub">一句话就够了</span><button class="btn primary">接住它</button></div></form><div class="cats"><button class="btn cat active" data-cat="today"><strong>到点叫我</strong><small>有明确时间</small></button><button class="btn cat" data-cat="later"><strong>有空就做</strong><small>随时可以做</small></button><button class="btn cat" data-cat="context"><strong>下次遇到</strong><small>人物、地点或情境</small></button><button class="btn cat" data-cat="someday"><strong>未来目标</strong><small>以后想实现</small></button></div><section class="box"><div class="view-title"><h2 id="view-title">到点叫我</h2><span id="view-hint" class="sub">0 件</span></div><div id="keywords" class="keywords"></div><div id="list"></div></section><div class="view-title"><h2>已经放下</h2><span class="sub">历史记录</span></div><div class="shelf"><button class="btn" data-shelf="done"><strong>已经放下</strong><br><small>0 件</small></button><button class="btn" data-shelf="all"><strong>全部记录</strong><br><small>0 件</small></button></div><div id="toast" class="toast"></div></main><script>(()=>{const app=document.getElementById('app'),form=document.getElementById('form'),input=document.getElementById('input'),list=document.getElementById('list'),count=document.getElementById('count'),title=document.getElementById('view-title'),hint=document.getElementById('view-hint'),keys=document.getElementById('keywords'),toast=document.getElementById('toast');const examples=['例如：明早九点提醒我交报告','例如：下次见小明问问新项目','例如：有空给房子窗户量一下尺寸','例如：未来想买一套带院子的房子','例如：周末把照片备份一下','例如：下次去牛表妹烤肉记得提前订位','例如：以后想学会做意大利菜'];input.placeholder=examples[Math.floor(Math.random()*examples.length)];let items=JSON.parse(localStorage.getItem('held-items-v4')||'null')||[],cat='today',key='';const save=()=>localStorage.setItem('held-items-v4',JSON.stringify(items));const say=x=>{toast.textContent=x;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)};const bucket=x=>/(明天|后天|今天|明早|明晚|周[一二三四五六日天]|周末|[上下]午|[0-2]?\d[点时])/.test(x)?'today':/(下次|见|遇到|去|联系|问问|订位)/.test(x)?'context':/(未来|以后|梦想|目标|想买|想学|想成为)/.test(x)?'someday':'later';const meta=x=>{const m=x.match(/([0-2]?\d)[点时]/);return m?'已设定 · '+m[1].padStart(2,'0')+':00':/(明天|后天|今天|明早|明晚|周末|周[一二三四五六日天])/.test(x)?'已识别时间':'没有具体时间'};const extract=x=>{const known=['妈妈','爸爸','猫咪','狗狗','小明','奥菲利亚','牛表妹烤肉','物业','公司','医院','家里'];return known.filter(k=>x.includes(k))};const calendar=x=>{const m=x.meta.match(/(\d{1,2}):(\d{2})/),d=new Date();if(m){d.setHours(+m[1],+m[2],0,0);if(d<=new Date())d.setDate(d.getDate()+1)}else d.setHours(d.getHours()+1);const p=n=>String(n).padStart(2,'0'),stamp=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00',ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//HeldApp//CN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+x.id+'@held-app','DTSTAMP:'+stamp,'DTSTART:'+stamp,'DTEND:'+stamp,'SUMMARY:'+x.text.replace(/[\\,;]/g,' '),'END:VEVENT','END:VCALENDAR'].join(String.fromCharCode(13,10)),u=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})),a=document.createElement('a');a.href=u;a.download='先放下-日历事件.ics';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);say('已生成日历文件，请用手机日历打开')};function draw(){const active=items.filter(x=>!x.done&&x.bucket===cat&&(cat!=='context'||!key||x.keywords.includes(key)));count.textContent=items.filter(x=>!x.done).length+' 件挂着';title.textContent={today:'到点叫我',later:'有空就做',context:'下次遇到',someday:'未来目标'}[cat];hint.textContent=active.length+' 件';keys.innerHTML='';if(cat==='context'){const ks=[...new Set(items.filter(x=>!x.done&&x.bucket==='context').flatMap(x=>x.keywords))];ks.forEach(k=>{const b=document.createElement('button');b.className='keyword'+(k===key?' active':'');b.textContent=k;b.onclick=()=>{key=key===k?'':k;draw()};keys.appendChild(b)})}list.innerHTML=active.length?'':'<div class="empty">这里还没有记录。</div>';active.forEach(x=>{const e=document.createElement('div');e.className='item';e.innerHTML='<div class="row"><span class="text"></span><span class="meta"></span></div><div class="actions"><button class="btn cal">加入手机日历</button><button class="btn later">改到明天</button><button class="btn drop">放下</button></div>';e.querySelector('.text').textContent=x.text;e.querySelector('.meta').textContent=x.meta;e.querySelector('.cal').onclick=()=>calendar(x);e.querySelector('.later').onclick=()=>{x.bucket='today';x.meta='明天 · 10:00';save();say('改到明天');draw()};e.querySelector('.drop').onclick=()=>{x.done=true;save();say('已从心里放下');draw()};list.appendChild(e)});app.querySelector('[data-shelf=done] small').textContent=items.filter(x=>x.done).length+' 件';app.querySelector('[data-shelf=all] small').textContent=items.length+' 件'}form.onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;items.unshift({id:Date.now(),text,meta:meta(text),bucket:bucket(text),keywords:extract(text),done:false});save();input.value='';say('已替你记住');draw()};app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;key='';app.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));draw()});app.querySelector('[data-shelf=done]').onclick=()=>{cat='done';title.textContent='已经放下';const done=items.filter(x=>x.done);list.innerHTML=done.length?done.map(x=>'<div class="item"><span>'+x.text+'</span><div class="meta">已放下</div></div>').join(''):'<div class="empty">还没有放下的事项。</div>';keys.innerHTML='';hint.textContent=done.length+' 件'};app.querySelector('[data-shelf=all]').onclick=()=>{cat='all';title.textContent='全部记录';const all=items;list.innerHTML=all.length?all.map(x=>'<div class="item"><span>'+x.text+'</span><div class="meta">'+(x.done?'已放下':x.meta)+'</div></div>').join(''):'<div class="empty">还没有记录。</div>';keys.innerHTML='';hint.textContent=all.length+' 件'};draw()})()</script></body></html>
