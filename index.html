<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>先放下</title></head><body style='margin:0'><div style='min-height:100vh'><div id="held-by-you" style="font-family:system-ui,sans-serif;max-width:680px;margin:auto;padding:24px;background:#f7f4ee;color:#24231f">
<style>#held-by-you textarea{width:100%;min-height:70px;border:1px solid #ddd5c8;border-radius:12px;padding:12px;font:inherit;box-sizing:border-box}#held-by-you button{border:1px solid #d8d0c4;border-radius:999px;padding:9px 14px;background:#fffdf8;cursor:pointer}#held-by-you .primary{background:#6f8067;color:white;border:0}.box{background:#fffdf8;border:1px solid #e6e0d5;border-radius:14px;padding:14px;margin:10px 0}.meta{font-size:12px;color:#79756b;margin-top:6px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.shelf button{text-align:left;border-radius:10px}@media(max-width:520px){.shelf{grid-template-columns:repeat(2,1fr)}}</style>
<div class="row"><div><div style="font-size:12px;color:#6f8067">先放下</div><h1 style="margin:7px 0">有什么事挂在心上？</h1><div style="color:#79756b;font-size:14px">写下来，我替你记着。</div></div><div id="held-count" style="font-size:12px;color:#79756b">0 件挂着</div></div>
<form id="held-form" class="box"><textarea id="held-text" aria-label="记录一件事" placeholder="例如：周三下午提醒我给妈妈买药"></textarea><div class="row" style="margin-top:9px"><span style="font-size:12px;color:#79756b">支持“明天”“周末”“下周一”</span><button class="primary" type="submit">接住它</button></div></form>
<h3 style="font-size:16px;font-weight:500">现在需要你处理</h3><div id="held-list"></div><h3 style="font-size:16px;font-weight:500;margin-top:24px">替你记着</h3>
<div class="shelf"><button data-shelf="later"><strong>有空再做</strong><small>0 件</small></button><button data-shelf="context"><strong>下次遇到</strong><small>0 件</small></button><button data-shelf="someday"><strong>以后再想</strong><small>0 件</small></button><button data-shelf="done"><strong>已经放下</strong><small>0 件</small></button></div><div id="held-toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2e332d;color:white;padding:10px 14px;border-radius:999px;display:none"></div>
<script>(()=>{const r=document.getElementById('held-by-you'),f=r.querySelector('#held-form'),i=r.querySelector('#held-text'),l=r.querySelector('#held-list'),t=r.querySelector('#held-toast');let a=JSON.parse(localStorage.getItem('held-items-v2')||'null')||[{id:1,text:'周三下午给妈妈买药',meta:'周三 · 15:00',bucket:'today',done:false},{id:2,text:'下次和小李见面，问问他的新工作',meta:'下次遇到 · 小李',bucket:'context',done:false}];const save=()=>localStorage.setItem('held-items-v2',JSON.stringify(a)),say=x=>{t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)},meta=x=>/(明天|后天)/.test(x)?x.match(/明天|后天/)[0]+' · 10:00':/周末/.test(x)?'周末 · 10:00':/周[一二三四五六日天].*(点|时)/.test(x)?'已设定时间':'有空再做',bucket=x=>/(明天|后天|周[一二三四五六日天]|周末|点|时)/.test(x)?'today':/(下次|见面|遇到|问问)/.test(x)?'context':/(以后|想学|想做)/.test(x)?'someday':'later';function draw(){const active=a.filter(x=>!x.done&&(x.bucket==='today'||x.bucket==='later'));r.querySelector('#held-count').textContent=active.length+' 件挂着';l.innerHTML=active.length?'':'<div class="box" style="color:#79756b">这里很安静。记录一件事，先让它离开你的脑子。</div>';active.forEach(x=>{const e=document.createElement('div');e.className='box';e.innerHTML='<div class="row"><span class="txt"></span><button class="ok">完成</button></div><div class="meta"></div><div style="margin-top:8px"><button class="later">换个时间</button> <button class="drop">放下</button></div>';e.querySelector('.txt').textContent=x.text;e.querySelector('.meta').textContent=x.meta;e.querySelector('.ok').onclick=()=>{x.done=true;x.bucket='done';save();say('已经放下');draw()};e.querySelector('.drop').onclick=()=>{x.done=true;x.bucket='done';save();say('已从心里放下');draw()};e.querySelector('.later').onclick=()=>{x.meta='明天 · 10:00';x.bucket='today';save();say('明天再提醒你');draw()};l.appendChild(e)});r.querySelectorAll('.shelf button').forEach(b=>{const k=b.dataset.shelf;b.querySelector('small').textContent=a.filter(x=>x.bucket===k).length+' 件'})}f.onsubmit=e=>{e.preventDefault();const x=i.value.trim();if(!x)return;a.unshift({id:Date.now(),text:x,meta:meta(x),bucket:bucket(x),done:false});save();i.value='';say('已替你记住');draw()};draw()})()</script></div></div></body></html>
